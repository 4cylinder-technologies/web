<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gauges — 4Cylinder Technologies</title>
  <link rel="icon" type="image/png" href="./gauges-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./ace-admin.css" />
  <link rel="stylesheet" href="./gauges.css" />
</head>
<body>
  <!-- Decorative background silhouette, added 8/2 for client demos —
       see .bg-watermark's comment in ace-admin.css. -->
  <img class="bg-watermark" src="./gauges-logo.png" alt="" aria-hidden="true" />
  <div class="ace-header">
    <div class="ace-brand">
      <!-- Gauges-specific brand mark, added 8/2 (Michael's generated
           tachometer/4C logo) — reuses .ace-brand img's existing sizing/
           glow from ace-admin.css (already styled for a header logo, same
           slot the ACE dashboard's own icon sits in), no new CSS needed
           here. -->
      <img src="./gauges-logo.png" alt="Gauges" />
      <div class="ace-brand-text">
        <h1>Gauges</h1>
        <div class="ace-brand-sub">The instrument cluster for 4Cylinder Technologies</div>
      </div>
    </div>
    <nav class="ace-nav">
      <a href="./dashboard.html">ACE Dashboard</a>
      <a href="./gauges.html" class="active">Gauges</a>
      <a href="#" id="logout-link">Sign out</a>
    </nav>
  </div>

  <div class="ace-container">
    <div class="ace-card gauges-toolbar">
      <div>
        <div style="font-family:'Syne',sans-serif; font-weight:700; font-size:14px;">All gauges</div>
        <div style="color:var(--muted); font-size:12px; margin-top:2px;" id="last-updated">Loading…</div>
      </div>
      <button class="gauges-refresh-btn" id="refresh-btn">Refresh now</button>
    </div>

    <!-- Tabs, added 8/1 (Michael: "That page is long! ... can we do
         something simpler like tabs across the top") — replaces the old
         stacked <details> sections, which required scrolling past every
         other gauge to reach one further down. Tab bar + panels are built
         entirely from the SECTIONS map in the script below (one source of
         truth, same "add one entry, not touch the wiring" philosophy the
         data-loading code already used) — this container is just the
         mount point. -->
    <div class="ace-card gauges-tabcard" style="margin-top:18px;">
      <div class="gauges-tabs" id="gauges-tabs" role="tablist"></div>
      <div id="gauges-panels"></div>
    </div>
  </div>

  <script type="module">
    import { AceAdmin } from './ace-admin.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { httpsCallable } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';

    // Gen2 Cloud Run URL flakiness (firebase/firebase-functions#1447) — real,
    // recurring. Updated again 8/1 (Play Console phase): a stuck "Skipped
    // (No changes detected)" false-skip (confirmed via grep — the local
    // source genuinely had the new Play collector code, but two separate
    // `firebase deploy` runs both skipped both functions) required deleting
    // gaugesCollector + gaugesCollectorManual and letting the deploy
    // recreate them fresh. That recreate printed the cloudfunctions.net
    // alias form this time, not the old .run.app URL that was here before —
    // and since the function was fully deleted/recreated, the old .run.app
    // URL is almost certainly dead now, not just stale. Lesson holds: after
    // ANY gen2 functions deploy (routine or a delete+recreate), read the
    // actual printed "Function URL (...)" line — never assume this stays
    // stable across deploys.
    const MANUAL_REFRESH_URL = 'https://us-central1-dashboard-air-dd713.cloudfunctions.net/gaugesCollectorManual';

    function timeAgo(iso) {
      if (!iso) return 'unknown';
      const ms = Date.now() - new Date(iso).getTime();
      const days = Math.floor(ms / 86400000);
      if (days > 0) return `${days}d ago`;
      const hours = Math.floor(ms / 3600000);
      if (hours > 0) return `${hours}h ago`;
      const mins = Math.floor(ms / 60000);
      return mins <= 0 ? 'just now' : `${mins}m ago`;
    }

    function repoCardHtml(repoName, r) {
      if (r.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${repoName}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${r.error}</div>
          </div>`;
      }
      // "Stale" isn't a real health signal by itself (a quiet repo isn't
      // broken) — this LED just reflects how recently the collector saw a
      // commit, so it's a freshness indicator, not a pass/fail judgment.
      const days = (Date.now() - new Date(r.latestCommitDate).getTime()) / 86400000;
      const ledClass = days < 3 ? 'ok' : days < 14 ? 'warn' : 'ok';
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${repoName}</span>
            <span class="gauge-led ${ledClass}" title="${r.defaultBranch} branch"></span>
          </div>
          <div class="gauge-lcd">
            <span class="dim">commit</span> ${r.latestCommitSha}<br>
            "${r.latestCommitMessage}"
          </div>
          <div class="gauge-meta-row">
            <span>${timeAgo(r.latestCommitDate)}</span>
            <span>${r.latestReleaseTag ? `release ${r.latestReleaseTag}` : 'no releases'}</span>
          </div>
        </div>`;
    }

    function revenueCatCardHtml(projectName, p) {
      if (p.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${projectName}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${p.error}</div>
          </div>`;
      }
      const rows = (p.metrics || [])
        // RC v2 returns unit as '#', '$' or 'percentage'; '$' was unhandled so MRR rendered as a bare number.
        .map(m => `${m.name}: <span class="dim">${m.unit === 'percentage' ? `${Number(m.value).toFixed(2)}%` : m.unit === '$' ? `$${Number(m.value).toLocaleString('en-US')}` : m.value}</span>${m.description ? ` <span class="dim">(${m.description})</span>` : ''}`)
        .join('<br>');
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${projectName}</span>
            <span class="gauge-led ok"></span>
          </div>
          <div class="gauge-lcd">${rows || '<span class="dim">No metrics returned</span>'}</div>
        </div>`;
    }

    // Scope is deliberately version/release status only, not ratings — see
    // the 8/1 note in gauges/functions/index.js for why (Apple's API has no
    // endpoint for the real star rating, only written reviews, which would
    // misrepresent the actual public rating).
    const ASC_STATE_LED = {
      READY_FOR_SALE: 'ok',
      REJECTED: 'error',
      DEVELOPER_REJECTED: 'error',
      METADATA_REJECTED: 'error',
      INVALID_BINARY: 'error',
      REMOVED_FROM_SALE: 'error',
    };

    function appStoreConnectCardHtml(appName, a) {
      if (a.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${appName}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${a.error}</div>
          </div>`;
      }
      const ledClass = ASC_STATE_LED[a.appStoreState] || 'warn';
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${appName}</span>
            <span class="gauge-led ${ledClass}" title="${a.platform}"></span>
          </div>
          <div class="gauge-lcd">
            <span class="dim">version</span> ${a.versionString}<br>
            ${a.appStoreState}
          </div>
          <div class="gauge-meta-row">
            <span>${timeAgo(a.stateChangedAt || a.createdDate)}</span>
            <span>${a.platform || ''}</span>
          </div>
        </div>`;
    }

    // Track status LEDs mirror ASC_STATE_LED's judgment (a real release
    // state, safe to color-code) — "completed" is Play's equivalent of
    // READY_FOR_SALE.
    const PLAY_TRACK_STATE_LED = {
      completed: 'ok',
      halted: 'error',
      inProgress: 'warn',
      draft: 'warn',
    };

    function playTrackCardHtml(appName, a) {
      if (a.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${appName}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${a.error}</div>
          </div>`;
      }
      const ledClass = PLAY_TRACK_STATE_LED[a.status] || 'warn';
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${appName}</span>
            <span class="gauge-led ${ledClass}" title="${a.track} track"></span>
          </div>
          <div class="gauge-lcd">
            <span class="dim">version</span> ${a.versionName || a.versionCode}<br>
            ${a.status}
          </div>
          <div class="gauge-meta-row">
            <span>${a.track} track</span>
            <span>build ${a.versionCode || '—'}</span>
          </div>
        </div>`;
    }

    // LED here reflects "is the collector returning data", not a judgment on
    // the rate itself — same convention as revenueCatCardHtml. No baseline
    // for "good" crash/ANR rate has been set, so coloring this red/green
    // would be an invented threshold, not a real signal.
    function playVitalsCardHtml(appName, a) {
      if (a.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${appName}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${a.error}</div>
          </div>`;
      }
      const fmt = (v) => (typeof v === 'number' ? `${(v * 100).toFixed(2)}%` : (v == null ? 'no data' : JSON.stringify(v)));
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${appName}</span>
            <span class="gauge-led ok"></span>
          </div>
          <div class="gauge-lcd">
            crash rate: <span class="dim">${fmt(a.crashRate)}</span><br>
            ANR rate: <span class="dim">${fmt(a.anrRate)}</span>
          </div>
          <div class="gauge-meta-row">
            <span>trailing 7 days</span>
          </div>
        </div>`;
    }

    // LED here reflects "is the collector returning data" (same convention as
    // revenueCatCardHtml/playVitalsCardHtml) — no invented good/bad threshold
    // for engagement numbers. metricsUpdatedAt is Buffer's own freshness
    // timestamp for that channel's rollup, separate from our own collector's
    // updatedAt — shown so a stale Buffer-side number is visible as such.
    // 8/2: escapes post caption text specifically — unlike the rest of this
    // file's card-html functions (which only ever render trusted API field
    // names Michael doesn't author, e.g. repo/project names), the leaderboard
    // below renders his own freeform post captions, which can contain
    // &/</>/quotes.
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function bufferCardHtml(channelName, c) {
      if (c.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${channelName}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${c.error}</div>
          </div>`;
      }
      // isLeaderboard: the synthetic "Top 5 Posts" entry collectBufferGauge()
      // inserts alongside the normal per-channel entries (see its comment) —
      // same card shell, different body (ranked post list vs metric list).
      if (c.isLeaderboard) {
        // Repost pill: starts disabled ("checking…") — Buffer's posts query
        // has no media field (confirmed 8/2), so reposting from p alone would
        // silently drop the image. enhanceLeaderboardRepost() (below) matches
        // each post to its bufferPushLog entry (which does have imageUrl) by
        // channelId + dueAt after this HTML is in the DOM, and only then
        // enables the ones with a real match — never falls back to a
        // text-only repost built from p itself.
        const rows = (c.posts || []).length
          ? c.posts.map((p, i) => `${i + 1}. <span class="dim">${escapeHtml(p.channel)}</span> — ${escapeHtml(p.text)}${(p.text || '').length >= 90 ? '…' : ''} <button type="button" class="gauges-refresh-btn repost-pill" style="font-size:11px; padding:2px 10px;" data-idx="${i}" data-channel-id="${escapeHtml(p.channelId || '')}" data-due-at="${escapeHtml(p.dueAt || '')}" disabled title="Checking for a matching push-log entry…">Repost</button><br><span class="dim">${p.reactions} reactions · ${p.comments} comments</span>`).join('<br><br>')
          : '<span class="dim">No sent posts in this window</span>';
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${channelName}</span>
              <span class="gauge-led ${c.error ? 'error' : 'ok'}" ${c.error ? `title="${escapeHtml(c.error)}"` : ''}></span>
            </div>
            <div class="gauge-lcd">${c.error ? `ERROR<br>${escapeHtml(c.error)}` : rows}</div>
            <div class="gauge-meta-row"><span>trailing 30 days, across all channels</span><span></span></div>
          </div>`;
      }
      const rows = (c.metrics || [])
        .map(m => `${m.name}: <span class="dim">${m.unit === 'percentage' ? `${Number(m.value).toFixed(2)}%` : m.value}</span>`)
        .join('<br>');
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${channelName}</span>
            <span class="gauge-led ok"></span>
          </div>
          <div class="gauge-lcd">${rows || '<span class="dim">No metrics for this window</span>'}</div>
          <div class="gauge-meta-row">
            <span>trailing 30 days</span>
            <span>${c.metricsUpdatedAt ? `Buffer data: ${timeAgo(c.metricsUpdatedAt)}` : ''}</span>
          </div>
        </div>`;
    }

    // LED here reflects "is the collector returning data" (same convention
    // as revenueCatCardHtml/bufferCardHtml) — no invented good/bad threshold
    // for traffic numbers. An empty metrics array is a legitimate "no data
    // yet" state (e.g. right after standing up a brand-new GA4 property),
    // not necessarily a collector error — shown as its own message rather
    // than the generic "returned nothing" one loadSection() would otherwise
    // print.
    // Merged 8/2 AM (Michael: "move everything in uptime to the website tab
    // and get rid of uptime") — same pattern as latestUpdatesCardHtml:
    // `s.ga4` and `s.uptime` are independently nullable/error-able sub-
    // objects from collectWebsiteGauge, both keyed by the same site label.
    function websiteCardHtml(siteName, s) {
      const ga4 = s.ga4;
      const uptime = s.uptime;
      const hasGa4Error = !!(ga4 && ga4.error);
      const hasUptimeError = !!(uptime && uptime.error);
      const ledClass = (hasGa4Error || hasUptimeError) ? 'error' : 'ok';
      const ledTitle = hasGa4Error ? 'GA4 collector error' : hasUptimeError ? 'Non-2xx or unreachable' : 'Up to date';

      const ga4Html = !ga4 ? '' : ga4.error
        ? `<span class="dim">GA4</span> <span class="error-tone">ERROR — ${ga4.error}</span>`
        : (() => {
            const rows = (ga4.metrics || []).map(m => `${m.name}: <span class="dim">${m.value}</span>`).join('<br>');
            return rows || '<span class="dim">No traffic recorded for this window yet</span>';
          })();

      const uptimeHtml = !uptime ? '' : uptime.error
        ? `<span class="dim">Uptime</span> <span class="error-tone">ERROR — ${uptime.error}</span>`
        : (uptime.metrics || []).map(m => `${m.name}: <span class="dim">${m.value}${m.unit === 'ms' ? 'ms' : ''}</span>`).join('<br>');

      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${siteName}</span>
            <span class="gauge-led ${ledClass}" title="${ledTitle}"></span>
          </div>
          <div class="gauge-lcd">
            ${[ga4Html, uptimeHtml].filter(Boolean).join('<br><br>')}
          </div>
          <div class="gauge-meta-row">
            <span>GA4: trailing 7 days</span>
            <span><a href="${siteName.startsWith('http') ? siteName : `https://${siteName}`}" target="_blank" rel="noopener">Visit site →</a></span>
          </div>
        </div>`;
    }

    // Same "LED = is the collector returning data" convention as the other
    // cards. Firebase metrics are plain counts (Auth users, users/ doc
    // count) per project — the entriesKey is 'projects' so this scales to
    // however many FIREBASE_PROJECTS entries the backend defines, with zero
    // changes needed here when a future app/project is added.
    function firebaseCardHtml(projectLabel, p) {
      if (p.error) {
        return `
          <div class="gauge-card">
            <div class="gauge-card-head">
              <span class="gauge-card-title">${projectLabel}</span>
              <span class="gauge-led error" title="Collector error"></span>
            </div>
            <div class="gauge-lcd error-tone">ERROR<br>${p.error}</div>
          </div>`;
      }
      const rows = (p.metrics || []).map(m => `${m.name}: <span class="dim">${m.value}</span>`).join('<br>');
      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${projectLabel}</span>
            <span class="gauge-led ok"></span>
          </div>
          <div class="gauge-lcd">${rows || '<span class="dim">No data yet</span>'}</div>
        </div>`;
    }

    // Added 8/2 (~12:30am), Michael's ask: see the latest ACE run status
    // from Gauges, not just the separate ACE Dashboard. LED reflects
    // whether there's a run sitting unpublished (warn) vs. everything
    // that's run has been published (ok) — same "collector health, not an
    // invented business threshold" convention as the other cards, just
    // applied to "does something need your review" instead of an API error.
    // "board" = category count on the run doc (how many categories were
    // voted on), not how many were approved/published — see the backend
    // comment for why that distinction matters and isn't collapsed here.
    // Renamed 8/2 AM from aceCardHtml — now shows BOTH the ACE run status
    // (DashboardAIR/AskAIR only, since MyOwnIQ doesn't use ACE) and the
    // latest OTA/EAS Update (all three apps) in one card per app, per
    // Michael's "Latest Updates" consolidation idea. `a.ace` and `a.ota` are
    // each independently nullable/error-able — MyOwnIQ legitimately has no
    // `ace` section rather than a fake empty one. "board" = category count
    // on the ACE run doc (how many categories were voted on), not how many
    // were approved/published — see the backend comment for why that
    // distinction isn't collapsed here.
    function latestUpdatesCardHtml(appLabel, a) {
      const ace = a.ace;
      const ota = a.ota;
      const hasPending = ace && ace.latestRunStatus === 'awaiting_review';
      const hasAceError = !!(ace && ace.error);
      const hasOtaError = !!(ota && ota.error);
      const ledClass = (hasAceError || hasOtaError) ? 'error' : (hasPending ? 'warn' : 'ok');
      const ledTitle = hasAceError ? 'ACE collector error' : hasOtaError ? 'OTA collector error' : hasPending ? 'An ACE run is awaiting review' : 'Up to date';

      const aceHtml = !ace ? '' : ace.error
        ? `<span class="dim">ACE</span> <span class="error-tone">ERROR — ${ace.error}</span>`
        : (() => {
            const publishedLine = ace.publishedRunId
              ? `${ace.publishedBoardSize}-category board, ${timeAgo(ace.publishedAt)}`
              : 'never published';
            const latestLine = ace.latestRunId
              ? `${ace.latestRunStatus} — ${ace.latestRunBoardSize}-category board, ${timeAgo(ace.latestRunDate)}`
              : 'no runs yet';
            const pendingNote = hasPending && ace.pendingReviewCount != null ? ` (${ace.pendingReviewCount} awaiting review)` : '';
            return `<span class="dim">ACE published</span> ${publishedLine}<br><span class="dim">ACE latest run</span> ${latestLine}${pendingNote}`;
          })();

      const otaHtml = !ota ? '' : ota.error
        ? `<span class="dim">OTA</span> <span class="error-tone">ERROR — ${ota.error}</span>`
        : `<span class="dim">OTA latest</span> runtime ${ota.runtimeVersion}, "${ota.branch}" branch, ${timeAgo(ota.publishedAt)}<br><span class="dim">update ID</span> ${ota.updateId || 'unknown'}${ota.message ? `<br>"${ota.message.slice(0, 100)}"` : ''}`;

      const otaLink = ota && ota.expoUrl ? `<a href="${ota.expoUrl}" target="_blank" rel="noopener">Expo →</a>` : '';

      return `
        <div class="gauge-card">
          <div class="gauge-card-head">
            <span class="gauge-card-title">${appLabel}</span>
            <span class="gauge-led ${ledClass}" title="${ledTitle}"></span>
          </div>
          <div class="gauge-lcd">
            ${[aceHtml, otaHtml].filter(Boolean).join('<br><br>')}
          </div>
          ${otaLink ? `<div class="gauge-meta-row"><span></span><span>${otaLink}</span></div>` : ''}
        </div>`;
    }

    // 8/2 (Michael's ask): on the Buffer tab specifically, lock the Top 5
    // Posts card to the right and let the smaller per-channel cards wrap in
    // a sub-grid to its left, filling the screen instead of the leaderboard
    // just flowing wherever it happens to land alphabetically. Buffer-only —
    // every other section keeps the plain auto-fill grid untouched. Done as
    // a post-render DOM reflow (move nodes into a wrapper) rather than
    // changing cardFn/loadSection's generic per-entry rendering, so the
    // other nine sections need zero changes. Matches the leaderboard card
    // by its known title text rather than a class, since cardFn functions
    // return plain HTML strings with no hook to tag "this one's special"
    // without touching bufferCardHtml's return shape for every other card.
    // 8/2 round 2: switched from position-based CSS (:last-child + relying
    // on insertBefore's DOM order) to an explicit class + explicit
    // grid-column on both regions. The position-based version put the
    // leaderboard on the LEFT (wide column) instead of the right — rather
    // than keep guessing why DOM order didn't match expectations, this
    // removes the ambiguity entirely: the leaderboard is tagged directly
    // and CSS targets that tag, so placement no longer depends on which
    // element happens to render first/last.
    function reflowBufferGrid(grid) {
      const cards = Array.from(grid.children).filter(el => el.classList.contains('gauge-card'));
      const leaderboard = cards.find(el => el.querySelector('.gauge-card-title')?.textContent.includes('Top 5 Posts'));
      if (!leaderboard || cards.length < 2) return; // nothing to reflow (collector error, or leaderboard-only state)
      leaderboard.classList.add('buffer-leaderboard');
      const wrap = document.createElement('div');
      wrap.className = 'buffer-small-cards';
      cards.forEach(el => { if (el !== leaderboard) wrap.appendChild(el); }); // moves each small card out of `grid` into `wrap`
      grid.appendChild(wrap);
      grid.appendChild(leaderboard); // re-append (moves, doesn't duplicate) so both are direct children of `grid` regardless of original order
    }

    async function loadSection(docId, gridId, cardFn, entriesKey) {
      const grid = document.getElementById(gridId);
      const snap = await getDoc(doc(AceAdmin.db, 'gauges', docId));
      if (!snap.exists()) {
        grid.innerHTML = '<div class="gauges-empty">No data yet — click "Refresh now" above, or wait for the 6-hour schedule.</div>';
        return null;
      }
      const data = snap.data();
      const entries = Object.entries(data[entriesKey] || {}).filter(([k]) => !k.startsWith('_'));
      grid.innerHTML = entries.length

    // ─── BUFFER PUSH (write), added 8/6 ──────────────────────────────────────
    // Web counterpart to social-agent/push_batch.js's CSV push, for anyone on
    // the gaugesAccess allow-list (admin or social role) — not just Michael's
    // terminal. Uploads go to Firebase Storage (Buffer's API needs a public
    // URL, not a raw file — same reason push_batch.js's CSV already has an
    // image_url column) and the CSV format matches that script exactly:
    // text,image_url,tags,posting_time. "tags" is accepted but not sent to
    // Buffer (no such field on a post) — kept only so an existing CSV drops
    // in unchanged. "image_url" may be an http(s) URL OR the exact filename

    // same one-file-per-network model push_batch.js already uses.
    //
    // NOT YET LIVE-TESTED end-to-end. Push one throwaway post scheduled well

    // 8/27: added Clear (resets the whole panel) and a 30-day History +
    // Repost dropdown, sourced from bufferPushLog — a new Firestore

    // channel/service/text/image through pushBufferBatch again with a fresh
    // dueAt ~5 minutes out (Buffer requires a future dueAt; there's no
    // "post now").
    const pushBufferBatch = (data) => httpsCallable(AceAdmin.functions, 'pushBufferBatch')(data);
    const listBufferChannelsFn = () => httpsCallable(AceAdmin.functions, 'listBufferChannels')();
    const getBufferPushHistoryFn = () => httpsCallable(AceAdmin.functions, 'getBufferPushHistory')();

    // Buffer's dueAt on a *post* and the dueAt we logged when *pushing* it
    // don't string-match new Date(...).toISOString() (confirmed 8/2) — same
    // gotcha as the rest of this file's date handling, so compare epoch ms
    // with a tolerance rather than string equality.
    function bufferDueAtCloseEnough(a, b, toleranceMs = 60000) {
      const ta = new Date(a).getTime();
      const tb = new Date(b).getTime();
      return Number.isFinite(ta) && Number.isFinite(tb) && Math.abs(ta - tb) <= toleranceMs;
    }

    // Repost pill for the Top 5 Posts leaderboard card, added 8/31.
    // Buffer's posts query (collectTopPostsGauge, gauges/functions/index.js)
    // returns id/text/dueAt/channelId/metrics — no media field (confirmed
    // 8/2, see that file's comments) — so there is no image to repost from
    // the leaderboard data itself. bufferPushLog (written by pushBufferBatch
    // for every push, including through this same Repost path) is the only
    // place that image lives. This matches each of the 5 posts back to its
    // log entry by channelId + dueAt (tolerant compare, see
    // bufferDueAtCloseEnough) and reposts from THAT entry — same
    // pushBufferBatch call the History panel's Repost button already uses,
    // no new Buffer API surface. A post with no match (pushed some other
    // way — social-agent's CSV tool, manually in Buffer's own UI, or it
    // simply predates history logging) gets a permanently disabled pill
    // with a tooltip explaining why, never a text-only fallback built from
    // the leaderboard's own (media-less) data.
    async function enhanceLeaderboardRepost(grid, posts) {
      const pills = () => Array.from(grid.querySelectorAll('.repost-pill'));
      if (!posts.length) return;
      let entries;
      try {
        const { data } = await getBufferPushHistoryFn();
        entries = data.entries || [];
      } catch (e) {
        pills().forEach(btn => { btn.title = `Repost unavailable — couldn't load push history: ${e.message}`; });
        return;
      }
      posts.forEach((p, i) => {
        const btn = grid.querySelector(`.repost-pill[data-idx="${i}"]`);
        if (!btn) return;
        const match = p.channelId
          ? entries.find(e => e.channelId === p.channelId && bufferDueAtCloseEnough(e.dueAt, p.dueAt))
          : null;
        if (!match) {
          btn.title = 'No matching push-log entry for this post, so there\'s no image on file to repost safely (it may have been pushed some other way, or predate history logging).';
          return;
        }
        btn.disabled = false;
        btn.title = `Repost to ${match.channelLabel || match.channelId}, scheduled ~5 minutes from now`;
        btn.addEventListener('click', async () => {
          if (!confirm(`Repost "${(match.text || '').slice(0, 60)}${(match.text || '').length > 60 ? '…' : ''}" to ${match.channelLabel || match.channelId}, scheduled ~5 minutes from now? This publishes publicly and can't be trivially undone.`)) return;
          btn.disabled = true;
          btn.textContent = 'Reposting…';
          try {
            const dueAt = new Date(Date.now() + 5 * 60 * 1000).toISOString();
            const { data } = await pushBufferBatch({
              rows: [{
                channelId: match.channelId,
                channelLabel: match.channelLabel,
                service: match.service,
                text: match.text,
                dueAt,
                imageUrl: match.imageUrl || undefined,
              }],
            });
            const r = data.results[0];
            btn.textContent = r.ok ? 'Reposted ✓' : 'Failed';
            if (!r.ok) {
              btn.title = `Repost failed: ${r.error}`;
              btn.disabled = false;
            }
          } catch (err) {
            btn.textContent = 'Failed';
            btn.title = `Repost failed: ${err.message}`;
            btn.disabled = false;
          }
        });
      });
    }

    let bufferUploadedImages = {}; // filename -> public download URL, this page load only

    // Converts "YYYY-MM-DD HH:MM" (America/New_York local, same convention
    // as push_batch.js) to a UTC ISO string WITHOUT relying on the browser's
    // own timezone — unlike push_batch.js (only ever run on Michael's Mac),
    // this tool may run on a team member's machine outside America/New_York.
    // Round-trips through Intl to get the real UTC offset for that exact
    // date, so it stays correct across the EST/EDT boundary rather than
    // assuming a fixed -4/-5.
    function nyLocalToUtcIso(localStr) {
      const [datePart, timePart] = (localStr || '').trim().split(' ');
      if (!datePart || !timePart) throw new Error(`Bad posting_time: "${localStr}"`);
      const [y, m, d] = datePart.split('-').map(Number);
      const [hh, mi] = timePart.split(':').map(Number);
      if ([y, m, d, hh, mi].some(Number.isNaN)) throw new Error(`Bad posting_time: "${localStr}"`);
      const guessUtc = Date.UTC(y, m - 1, d, hh, mi);
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York', hourCycle: 'h23',
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
      });
      const parts = Object.fromEntries(fmt.formatToParts(guessUtc).map(p => [p.type, p.value]));
      const nyReading = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute);
      const correctedUtc = guessUtc + (guessUtc - nyReading);
      return new Date(correctedUtc).toISOString();
    }

    // Minimal CSV parser (handles quoted fields with commas) — same approach
    // as push_batch.js's parseCsv, kept dependency-free for four columns.
    function parseBufferCsv(text) {
      const rows = []; let row = [], field = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
          else field += ch;
        } else if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
        } else field += ch;
      }
      if (field !== '' || row.length) { row.push(field); if (row.some(f => f !== '')) rows.push(row); }
      if (rows.length === 0) return [];
      const header = rows.shift().map(h => h.replace(/^\uFEFF/, '').trim());
      return rows.map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] ?? '').trim()])));
    }

    function wireBufferPush() {
      let parsedRows = [];

      document.getElementById('buffer-image-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        const listEl = document.getElementById('buffer-image-list');

            const fileRef = ref(storage, path);
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);
            bufferUploadedImages[file.name] = url;
            listEl.innerHTML += `<div>✅ ${escapeHtml(file.name)} → <span class="dim">${escapeHtml(url.slice(0, 60))}…</span></div>`;
          } catch (err) {

          }
        }
      });

      listBufferChannelsFn().then(({ data }) => {
        const select = document.getElementById('buffer-channel-select');
        const channels = data.channels || [];
        select.innerHTML = channels.length
          ? channels.map(c => `<option value="${c.id}" data-service="${c.service}">${escapeHtml(c.name)} (${escapeHtml(c.service)})</option>`).join('')
          : '<option value="">No connected channels found</option>';
      }).catch(err => {
        document.getElementById('buffer-channel-select').innerHTML = `<option value="">Error: ${escapeHtml(err.message)}</option>`;
      });

      // "Select all channels" — added 8/6, Michael's request, so cross-posting
      // the same CSV to every connected channel doesn't need cmd-clicking
      // each one by hand.
      document.getElementById('buffer-channel-select-all').addEventListener('change', (e) => {
        const select = document.getElementById('buffer-channel-select');
        Array.from(select.options).forEach(o => { if (o.value) o.selected = e.target.checked; });
        select.dispatchEvent(new Event('change'));
      });

      document.getElementById('buffer-csv-file').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        document.getElementById('buffer-csv-text').value = await file.text();
      });

      document.getElementById('buffer-preview-btn').addEventListener('click', () => {
        const csvText = document.getElementById('buffer-csv-text').value;
        let raw;
        try {
          raw = parseBufferCsv(csvText);
        } catch (err) {
          renderBufferPreview([]);
          document.getElementById('buffer-push-result').innerHTML = `<span style="color:#f87171;">CSV parse error: ${escapeHtml(err.message)}</span>`;
          return;
        }
        parsedRows = raw.map(r => {
          const row = { ...r };
          const rawImage = (r.image_url || '').trim();
          if (!rawImage) {
            row.resolvedImageUrl = null;
          } else if (/^https?:\/\//i.test(rawImage)) {
            row.resolvedImageUrl = rawImage;
          } else if (bufferUploadedImages[rawImage]) {
            row.resolvedImageUrl = bufferUploadedImages[rawImage];
          } else {
            row.resolvedImageUrl = null;
            row.error = `"${rawImage}" isn't an uploaded filename or a URL`;
          }
          if (!row.error && !r.text) row.error = 'Missing text';
          if (!row.error) {
            try { nyLocalToUtcIso(r.posting_time); } catch (err) { row.error = err.message; }
          }
          return row;
        });
        renderBufferPreview(parsedRows);
        const anyError = parsedRows.some(r => r.error);
        document.getElementById('buffer-push-btn').disabled =
          parsedRows.length === 0 || anyError || document.getElementById('buffer-channel-select').selectedOptions.length === 0;
      });

      document.getElementById('buffer-channel-select').addEventListener('change', () => {
        if (parsedRows.length && !parsedRows.some(r => r.error)) {
          document.getElementById('buffer-push-btn').disabled =
            document.getElementById('buffer-channel-select').selectedOptions.length === 0;
        }
      });

      document.getElementById('buffer-push-btn').addEventListener('click', async () => {
        const select = document.getElementById('buffer-channel-select');
        const targets = Array.from(select.selectedOptions)
          .filter(o => o.value)
          .map(o => ({ channelId: o.value, service: o.dataset.service, label: o.textContent }));
        if (targets.length === 0 || parsedRows.length === 0) return;
        const totalPosts = parsedRows.length * targets.length;
        const targetLabel = targets.length === 1 ? targets[0].label : `${targets.length} channels`;
        if (!confirm(`Push ${parsedRows.length} post${parsedRows.length === 1 ? '' : 's'} to ${targetLabel} (${totalPosts} total)?`)) return;

        const btn = document.getElementById('buffer-push-btn');
        btn.disabled = true; btn.textContent = 'Pushing…';
        try {
          // Same CSV rows, once per selected channel — pushBufferBatch already
          // takes channelId/service per-row, so fanning out here needs no
          // server-side change.
          const rows = targets.flatMap(t => parsedRows.map(r => ({
            channelId: t.channelId,
            channelLabel: t.label,
            service: t.service,
            text: r.text,
            dueAt: nyLocalToUtcIso(r.posting_time),
            imageUrl: r.resolvedImageUrl || undefined,
          })));
          const { data } = await pushBufferBatch({ rows });
          // Fanned out across channels, so label each result by channel, not
          // just row number — "Row 3" alone is ambiguous once the same CSV
          // went to 5 channels at once.
          const labelFor = (channelId) => targets.find(t => t.channelId === channelId)?.label || channelId;
          const lines = data.results.map((r, i) => {
            const rowNum = (i % parsedRows.length) + 1;
            const chLabel = escapeHtml(labelFor(r.row?.channelId));
            return r.ok
              ? `✅ ${chLabel} · Row ${rowNum}: scheduled (post ${r.post?.id || '—'})`
              : `❌ ${chLabel} · Row ${rowNum}: ${escapeHtml(r.error)}`;
          });
          document.getElementById('buffer-push-result').innerHTML = lines.join('<br>');
          loadBufferHistory(); // every attempt (ok or not) just got logged server-side — reflect it right away
        } catch (err) {
          document.getElementById('buffer-push-result').innerHTML = `<span style="color:#f87171;">Push failed: ${escapeHtml(err.message)}</span>`;
        } finally {
          btn.disabled = false; btn.textContent = 'Push';
        }
      });

      // Clear — resets the whole panel back to a blank slate (CSV text,
      // parsed preview, channel selection, push result, and the uploaded-
      // image map/list). Deliberately whole-panel rather than just the CSV
      // box: this form accumulates state across a session (uploaded images,
      // selected channels, a stale push-result message) and "clear" reads
      // most naturally as "start over," not "just empty the textarea."
      document.getElementById('buffer-clear-btn').addEventListener('click', () => {
        document.getElementById('buffer-csv-text').value = '';
        document.getElementById('buffer-csv-file').value = '';
        document.getElementById('buffer-image-input').value = '';
        document.getElementById('buffer-image-list').innerHTML = '';
        bufferUploadedImages = {};
        parsedRows = [];
        renderBufferPreview([]);
        document.getElementById('buffer-push-result').innerHTML = '';
        document.getElementById('buffer-push-btn').disabled = true;
        const select = document.getElementById('buffer-channel-select');
        Array.from(select.options).forEach(o => { o.selected = false; });
        document.getElementById('buffer-channel-select-all').checked = false;
      });

      // ─── History + Repost, added 8/27 (Michael's ask) ──────────────────
      // History is read from bufferPushLog (written server-side by
      // pushBufferBatch itself, see gauges/functions/index.js) rather than
      // re-derived from Buffer's own API — every entry already carries the
      // exact text/image/channel it was pushed with, so Repost needs zero
      // extra Buffer read calls to reconstruct a post.
      let historyEntries = [];

      function selectedHistoryEntry() {
        const id = document.getElementById('buffer-history-select').value;
        return historyEntries.find(e => e.id === id) || null;
      }

      function renderHistoryDetail() {
        const entry = selectedHistoryEntry();
        const detail = document.getElementById('buffer-history-detail');
        const repostBtn = document.getElementById('buffer-repost-btn');
        if (!entry) {
          detail.innerHTML = '';
          repostBtn.disabled = true;
          return;
        }
        const when = entry.pushedAt ? new Date(entry.pushedAt).toLocaleString('en-US', { timeZone: 'America/New_York' }) + ' ET' : '—';
        detail.innerHTML = `
          <div style="border:1px solid var(--border); border-radius:8px; padding:12px;">
            <div style="margin-bottom:6px;">${escapeHtml(entry.text || '')}</div>
            <div style="color:var(--muted);">
              ${escapeHtml(entry.channelLabel || entry.channelId)} ·
              ${entry.ok ? '<span class="badge approved">ok</span>' : `<span style="color:#f87171;">failed: ${escapeHtml(entry.error || 'unknown error')}</span>`}
              · pushed ${when}${entry.pushedBy ? ' by ' + escapeHtml(entry.pushedBy) : ''}
            </div>
            ${entry.imageUrl ? `<div style="margin-top:6px;"><span class="dim">${escapeHtml(entry.imageUrl.slice(0, 70))}…</span></div>` : ''}
          </div>
        `;
        repostBtn.disabled = false;
      }

      function loadBufferHistory() {
        const select = document.getElementById('buffer-history-select');
        select.innerHTML = '<option value="">Loading history…</option>';
        getBufferPushHistoryFn().then(({ data }) => {
          historyEntries = data.entries || [];
          if (historyEntries.length === 0) {
            select.innerHTML = '<option value="">No pushes in the last 30 days</option>';
            renderHistoryDetail();
            return;
          }
          select.innerHTML = '<option value="">Select a past push…</option>' + historyEntries.map(e => {
            const when = e.pushedAt ? new Date(e.pushedAt).toLocaleString('en-US', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '?';
            const preview = (e.text || '').slice(0, 60);
            return `<option value="${e.id}">${escapeHtml(when)} ET · ${escapeHtml(e.channelLabel || e.channelId)} · ${e.ok ? 'ok' : 'FAILED'} · ${escapeHtml(preview)}${preview.length >= 60 ? '…' : ''}</option>`;
          }).join('');
          renderHistoryDetail();
        }).catch(err => {
          select.innerHTML = `<option value="">Error: ${escapeHtml(err.message)}</option>`;
        });
      }

      document.getElementById('buffer-history-select').addEventListener('change', renderHistoryDetail);

      // Reposts exactly what was logged (same channel/service/text/image) at
      // a fresh dueAt a few minutes out — Buffer's createPost rejects a
      // dueAt that isn't in the future, and there's no "post immediately"
      // bypass in this API (confirmed against push_batch.js's own comments),
      // so "a few minutes from now" is the closest this gets to "post now."
      // If that cadence isn't what's wanted, this is the one line to change.
      document.getElementById('buffer-repost-btn').addEventListener('click', async () => {
        const entry = selectedHistoryEntry();
        if (!entry) return;
        if (!confirm(`Repost to ${entry.channelLabel || entry.channelId}, scheduled ~5 minutes from now?`)) return;
        const btn = document.getElementById('buffer-repost-btn');
        btn.disabled = true; btn.textContent = 'Reposting…';
        try {
          const dueAt = new Date(Date.now() + 5 * 60 * 1000).toISOString();
          const { data } = await pushBufferBatch({
            rows: [{
              channelId: entry.channelId,
              channelLabel: entry.channelLabel,
              service: entry.service,
              text: entry.text,
              dueAt,
              imageUrl: entry.imageUrl || undefined,
            }],
          });
          const r = data.results[0];
          document.getElementById('buffer-repost-result').innerHTML = r.ok
            ? `✅ Reposted — scheduled (post ${r.post?.id || '—'})`
            : `❌ Repost failed: ${escapeHtml(r.error)}`;
          loadBufferHistory();
        } catch (err) {
          document.getElementById('buffer-repost-result').innerHTML = `<span style="color:#f87171;">Repost failed: ${escapeHtml(err.message)}</span>`;
        } finally {
          btn.disabled = false; btn.textContent = 'Repost';
        }
      });

      loadBufferHistory();
    }

    function injectBufferPush() {
      const bufferPanel = document.querySelector('.gauge-panel[data-panel="buffer"]');
      if (!bufferPanel) return; // shouldn't happen — buildTabsAndPanels() must run before this
      bufferPanel.insertAdjacentHTML('beforeend', bufferPushHtml());
      wireBufferPush();
    }


    // Tier vocabulary differs by app — MUST match gauges/functions/
    // index.js's MYOWNIQ_TIERS/AIR_TIERS exactly, or a selection here would
    // just bounce off the server's own validation. MyOwnIQ's 3 tiers and
    // separate Firebase project confirmed by reading myowniq/functions/src/
    // index.ts + its admin-set*.js scripts, not guessed. AIR tiers now split
    // per-app: DashboardAIR's paid household tier is 'teams', AskAIR's is
    // 'family' — confirmed via HOUSEHOLD_TARGET_TIER in dashboardair/
    // functions/index.js, not guessed.
    const TIER_OPTIONS = {
      askair: ['free', 'pro', 'family'],
      dashboardair: ['free', 'pro', 'teams'],
      both: ['free', 'pro'],
      myowniq: ['free', 'personal', 'owner'],
    };

    function tierAdminHtml() {
      return `
        <div id="tier-admin-panel" style="margin-top:18px; padding-top:18px; border-top:1px solid var(--border);">
          <div style="font-family:'Syne',sans-serif; font-weight:700; font-size:14px; margin-bottom:4px;">User tier admin</div>
          <div style="color:var(--muted); font-size:12px; margin-bottom:12px;">Manually set a user's subscription tier directly in Firestore — bypasses Apple/Google billing. Same effect as each app's admin-set*.js scripts, just as a button.</div>
          <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
            <input id="tier-uid-input" type="text" placeholder="Firestore UID" style="flex:1; min-width:220px; background:#050a12; border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-family:'SF Mono','Menlo','Consolas',monospace; font-size:13px;" />
            <select id="tier-app-select" style="background:#050a12; border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px;">
              <option value="askair">AskAIR</option>
              <option value="dashboardair">DashboardAIR</option>
              <option value="both">Both (AskAIR + DashboardAIR)</option>
              <option value="myowniq">MyOwnIQ</option>
            </select>
            <select id="tier-value-select" style="background:#050a12; border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px;"></select>
            <button class="gauges-refresh-btn" id="tier-check-btn" type="button">Check</button>
            <button class="gauges-refresh-btn" id="tier-promote-btn" type="button" style="background:var(--orange); color:#050a12; border-color:var(--orange);">Set Tier</button>
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
            <label for="tier-history-select" style="color:var(--muted); font-size:12px; white-space:nowrap;">History:</label>
            <select id="tier-history-select" style="flex:1; min-width:280px; background:#050a12; border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px;">
              <option value="">Loading…</option>
            </select>
          </div>
          <div id="tier-result" class="gauge-lcd" style="margin-top:14px; display:none;"></div>
        </div>`;
    }

    // Most recent Set Tier actions (server-logged, cross-browser) — kept in
    // this array so the <select>'s value (an index) can look the full entry
    // back up without re-fetching. Repopulated on panel load and again after
    // every successful Set Tier, so it never goes stale within a session.
    let tierHistoryEntries = [];

    function fmtHistoryWhen(ms) {
      return ms ? new Date(ms).toLocaleString() : 'unknown time';
    }

    function fmtHistoryOption(e) {
      const who = e.email ? `${e.email} (${e.uid.slice(0, 8)}…)` : `${e.uid.slice(0, 8)}…`;
      return `${fmtHistoryWhen(e.setAt)} — ${who} → ${e.appId}: ${e.tier}`;
    }

    async function loadTierHistory() {
      const sel = document.getElementById('tier-history-select');
      if (!sel) return;
      try {
        const { data } = await getTierAdminHistory();
        tierHistoryEntries = data.entries || [];
        sel.innerHTML = tierHistoryEntries.length
          ? '<option value="">— Recent Set Tier actions —</option>' +
            tierHistoryEntries.map((e, i) => `<option value="${i}">${escapeHtml(fmtHistoryOption(e))}</option>`).join('')
          : '<option value="">No history yet</option>';
      } catch (e) {
        sel.innerHTML = '<option value="">History unavailable</option>';
      }
    }

    function renderTierResult(html, isError = false) {
      const el = document.getElementById('tier-result');
      el.style.display = 'block';
      el.className = 'gauge-lcd' + (isError ? ' error-tone' : '');
      el.innerHTML = html;
    }

    function fmtSub(appId, sub) {
      return sub
        ? `${appId}: <span class="dim">${escapeHtml(JSON.stringify(sub))}</span>`
        : `${appId}: <span class="dim">no subscription doc (defaults to FREE)</span>`;
    }

    // Repopulates the tier dropdown to match whichever app is selected —
    // e.g. switching to MyOwnIQ must never leave a stale "pro" option
    // sitting there, since the server rejects it outright for that app.
    // Defaults to the highest paid tier in the list (not "free"), since
    // this tool exists to grant comp access far more often than revoke it.
    function populateTierOptions() {
      const appId = document.getElementById('tier-app-select').value;
      const sel = document.getElementById('tier-value-select');
      const options = TIER_OPTIONS[appId];
      sel.innerHTML = options.map(t => `<option value="${t}">${t.charAt(0).toUpperCase() + t.slice(1)}</option>`).join('');
      sel.value = options[options.length - 1];
    }

    function injectTierAdmin() {
      const firebasePanel = document.querySelector('.gauge-panel[data-panel="firebase"]');
      if (!firebasePanel) return; // shouldn't happen — buildTabsAndPanels() must run before this
      firebasePanel.insertAdjacentHTML('beforeend', tierAdminHtml());

      document.getElementById('tier-app-select').addEventListener('change', populateTierOptions);
      populateTierOptions();
      loadTierHistory();

      // Picking a history entry re-fills the form with that action's
      // uid/app/tier (convenience for re-checking or repeating a past grant)
      // and shows its full detail in the LCD panel, same as a live result.
      document.getElementById('tier-history-select').addEventListener('change', (evt) => {
        const entry = tierHistoryEntries[evt.target.value];
        if (!entry) return;
        document.getElementById('tier-uid-input').value = entry.uid;
        document.getElementById('tier-app-select').value = entry.appId;
        populateTierOptions();
        document.getElementById('tier-value-select').value = entry.tier;
        renderTierResult(
          `History — ${escapeHtml(entry.email || '(no email on file)')} · <span class="dim">${escapeHtml(entry.uid)}</span><br>` +
          `Set <b>${escapeHtml(entry.appId)}</b> to <b>${escapeHtml(entry.tier)}</b> by ${escapeHtml(entry.setBy || 'unknown')} at ${fmtHistoryWhen(entry.setAt)}`
        );
      });

      document.getElementById('tier-check-btn').addEventListener('click', async () => {
        const uid = document.getElementById('tier-uid-input').value.trim();
        const appId = document.getElementById('tier-app-select').value;
        if (!uid) { renderTierResult('Enter a UID first.', true); return; }
        const btn = document.getElementById('tier-check-btn');
        btn.disabled = true; btn.textContent = 'Checking…';
        try {
          const { data } = await checkUserTier({ uid, appId });
          const lines = [
            data.exists ? `Account: ${escapeHtml(data.email || '(no email field)')}` : `No users/{uid} doc found in ${appId === 'myowniq' ? 'myowniq-prod' : 'dashboard-air-dd713'} — UID may not exist there.`,
            ...Object.entries(data.subscriptions).map(([app, sub]) => fmtSub(app, sub)),
          ];
          renderTierResult(lines.join('<br>'), !data.exists);
        } catch (e) {
          renderTierResult('Error: ' + escapeHtml(e.message), true);
        } finally {
          btn.disabled = false; btn.textContent = 'Check';
        }
      });

      document.getElementById('tier-promote-btn').addEventListener('click', async () => {
        const uid = document.getElementById('tier-uid-input').value.trim();
        const appId = document.getElementById('tier-app-select').value;
        const tier = document.getElementById('tier-value-select').value;
        if (!uid) { renderTierResult('Enter a UID first.', true); return; }
        if (!confirm(`Set tier "${tier}" for UID\n${uid}\non ${appId}?`)) return;
        const btn = document.getElementById('tier-promote-btn');
        btn.disabled = true; btn.textContent = 'Setting…';
        try {
          const { data } = await promoteUserTier({ uid, appId, tier });
          const lines = Object.entries(data.results).map(([app, r]) =>
            `${app}: <span class="dim">before</span> ${r.before ? escapeHtml(JSON.stringify(r.before)) : '(no doc)'} → <span class="dim">after</span> ${escapeHtml(JSON.stringify(r.after))}`
          );
          const emailLine = `<span class="dim">${escapeHtml(data.email || '(no email on file)')}</span><br>`;
          renderTierResult('✅ Done.<br>' + emailLine + lines.join('<br>'));
          loadTierHistory();
        } catch (e) {
          renderTierResult('Error: ' + escapeHtml(e.message), true);
        } finally {
          btn.disabled = false; btn.textContent = 'Set Tier';
        }
      });
    }

    (async () => {
      await AceAdmin.requireAuth();
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await AceAdmin.logout();
      });
      // 8/6: team members added with role:'social' (gaugesAccess/{email})
      // only get the Buffer tab — revenue/RevenueCat/App Store/etc. never
      // render or fetch for them. Cosmetic only (the real boundary is
      // server-side in gauges/functions/index.js's requireAccess/
      // requireAdmin) but keeps business data off their screen entirely.
      if (AceAdmin.role !== 'admin') {
        Object.keys(SECTIONS).forEach(id => { if (id !== 'buffer') delete SECTIONS[id]; });
      }
      buildTabsAndPanels();
      if (AceAdmin.role === 'admin') injectTierAdmin(); // paid-tier overrides — owner-only regardless of allow-list
      injectBufferPush();
      await loadAndRender();

      document.getElementById('refresh-btn').addEventListener('click', (e) => {
        refreshOne(null, e.currentTarget);
      });

      document.querySelectorAll('button[data-source]').forEach(btn => {
        const source = btn.dataset.source;
        const cfg = SECTIONS[source];
        btn.addEventListener('click', (e) => {
          refreshOne(source, e.currentTarget, cfg.gridId, cfg.cardFn, cfg.entriesKey);
        });
      });
    })();
  </script>
</body>
</html>
